{% extends "base.html" %}

{% block title %}Create User - FFSmart{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create User</h1>
    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Back to Users</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('admin.create_user') }}" class="form">
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        
        <div class="form-group">
            <label for="role">Role *</label>
            <select id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="HEAD_CHEF">Head Chef</option>
                <option value="CHEF">Chef</option>
                <option value="DELIVERY_PERSON">Delivery Person</option>
                <option value="ADMIN">Admin</option>
                <option value="HEALTH_SAFETY_OFFICER">Health & Safety Officer</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create User</button>
            <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
